[package]
name = "v4-mcp"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Agent Agency V4 - Model Context Protocol (MCP) server"

[dependencies]
# Workspace crates
v4-types = { workspace = true }
v4-tools = { workspace = true }
v4-governance = { workspace = true }

# Web framework (for HTTP transport)
axum = { version = "0.7", features = ["macros", "tokio"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Types
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
