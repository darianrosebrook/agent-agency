[package]
name = "v4-sandbox"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Agent Agency V4 - Sandboxed execution environment"

[dependencies]
v4-types.workspace = true
v4-tools = { path = "../v4-tools" }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
tokio = { workspace = true, features = ["sync", "time", "process", "fs"] }
async-trait.workspace = true

# Time
chrono.workspace = true

# Error handling
thiserror.workspace = true

# Cryptography (for content verification)
sha2.workspace = true
hex.workspace = true

# Unique identifiers
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
