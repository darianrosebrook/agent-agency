[package]
name = "v4-inference"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Agent Agency V4 - Local LLM inference with CoreML support"

[dependencies]
# Core types
v4-types = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Types
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Cryptography
sha2 = { workspace = true }
hex = { workspace = true }

# MLX inference (optional, Apple Silicon only)
mlx-rs = { version = "0.25", features = ["metal", "accelerate"], optional = true }
tokenizers = { version = "0.22", optional = true }
hf-hub = { version = "0.4", optional = true }
safetensors = { version = "0.4", optional = true }

[dev-dependencies]
tokio-test = { workspace = true }

[features]
default = []
# CoreML support (macOS only, legacy)
coreml = []
# MLX support (Apple Silicon, recommended)
mlx = ["dep:mlx-rs", "dep:tokenizers", "dep:hf-hub", "dep:safetensors"]
