[package]
name = "v4-postgres"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Agent Agency V4 - PostgreSQL adapter with pgvector for embeddings"

[dependencies]
# Workspace dependencies
v4-types = { workspace = true }

# Database - PostgreSQL with async support
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Types
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Crypto for content hashing
sha2 = { workspace = true }
hex = { workspace = true }

# Tracing
tracing = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }

[features]
default = []
# Enable mock database for testing without real postgres
mock = []
