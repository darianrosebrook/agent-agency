[package]
name = "telemetry"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
thiserror = "1.0"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
agent-agency-common-types = { path = "../common-types" }

[dev-dependencies]
tokio-test = "0.4"
