[package]
name = "agent-orchestration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
ron = "0.8"
tokio.workspace = true
async-trait.workspace = true

# Agent crates
agent-workers = { path = "../agent-workers" }
# Logging and observability
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror.workspace = true
uuid.workspace = true
chrono = { workspace = true, features = ["serde"] }
anyhow.workspace = true
schemars.workspace = true
futures = "0.3"
futures-util = "0.3"

# Database and persistence
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
tokio-postgres = "0.7"
parking_lot = "0.12"

# HTTP and web framework
reqwest = { workspace = true, features = ["json"] }
axum = { version = "0.7", optional = true }
axum-extra = { version = "0.9", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
utoipa = { version = "4.0", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "6.0", features = ["axum"], optional = true }

# Compression and utilities
flate2 = "1.0"
sha2 = "0.10"
regex = "1.10"
once_cell = "1.19"
tokio-util = "0.7"
rand = "0.8"
fastrand = "2.0"
md5 = "0.7"
crossbeam = "0.8"
clap = { version = "4.0", features = ["derive"] }
tempfile = "3.0"

# Machine learning and AI
linfa = "0.7"
linfa-linear = "0.7"
statrs = "0.16"
lru = "0.12"
strsim = "0.11"
# rust-bert removed - not used, and it pulls in torch-sys which conflicts with libtorch
# If PyTorch functionality is needed, use PyO3 to call Python's PyTorch instead
tokenizers = "0.19"
lingua = "1.6"
whatlang = "0.18"
comrak = "0.18"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
pest = "2.7"
pest_derive = "2.7"
json5 = "0.4"
nom = "7.1"
indicatif = "0.16"
console = "0.16"

# Graph algorithms and utilities
petgraph = "0.6"
seahash = "4.1"

# Local workspace crates
agent-agency-contracts = { path = "../agent-agency-contracts" }
agent-evaluation = { path = "../agent-evaluation" }
system-common-interfaces = { path = "../system-common-interfaces" }
# data-infrastructure = { path = "../data-infrastructure", optional = true, default-features = false }  # Circular dependency - using local type definitions instead
# CoreML can be enabled/disabled via feature flag - disable by default, enable with coreml feature
data-infrastructure = { path = "../data-infrastructure", default-features = false }  # Required for main.rs database initialization
# data-interfaces-adapters removed to break circular dependency - using inline adapter instead
# CoreML controlled via agent-orchestration's "coreml" feature
# When coreml feature is disabled, system-acceleration won't have CoreML
system-acceleration = { path = "../system-acceleration", default-features = false }
# Memory with embeddings but without CoreML (for tests)
agent-memory = { path = "../agent-memory", optional = true, default-features = false, features = ["database", "embeddings", "contracts"] }
system-resilience = { path = "../system-resilience" }
# Research without CoreML (for tests) - disable defaults, enable only required features
agent-research = { path = "../agent-research", optional = true, default-features = false }
agent-model-management = { path = "../agent-model-management", optional = true }
# agent-constitutional-council = { path = "../agent-constitutional-council", optional = true }  # Circular dependency - using local type definitions instead
system-federated-ml = { path = "../system-federated-ml", optional = true }
# agent-workers = { path = "../agent-workers", optional = true }  # Circular dependency - using local type definitions instead
agent-data-processing = { path = "../agent-data-processing", optional = true }  
development-tools = { path = "../development-tools", optional = true }

# Observability dependency
system-observability = { path = "../system-observability" }

# System monitoring
sysinfo = "0.30"

[features]
default = ["research", "coreml", "evaluation"]  # Research (claim extraction) is always-on per arbiter stack requirements; evaluation enabled for M1 Max development
coreml = ["system-acceleration/coreml", "data-infrastructure/coreml", "agent-memory/embeddings-coreml"]  # CoreML/ANE acceleration for production
system-acceleration = ["coreml"]  # Enable system acceleration features (alias for coreml)
api-server = ["axum", "axum-extra", "tower-http", "utoipa", "utoipa-swagger-ui"]
full = ["development-tools"]
# with_bert removed - rust-bert dependency removed
development = ["development-tools"]
memory = ["agent-memory/database", "agent-memory/embeddings", "agent-memory/contracts"]  # Gate memory functionality behind feature flag - no coreml
research = ["agent-research"]  # Research functionality (claim extraction) - now in default features
data-processing = ["dep:agent-data-processing"]  # Gate data processing integration behind feature flag
evaluation = []  # Gate evaluation framework behind feature flag
council = []  # Feature flag for council functionality
task-queue = []  # Enable task queue integration with data-infrastructure
tool-chain = []  # Feature flag for tool-chain functionality
mcp = []  # Feature flag for MCP functionality
runtime-optimization = ["dep:system-federated-ml"]  # Feature flag for runtime optimization (ArbiterPipelineOptimizer)
model-management = ["dep:agent-model-management"]  # Feature flag for model management functionality

[dev-dependencies]
insta = { version = "1.38", features = ["yaml"] }
proptest = "1.5"
testing-validation = { path = "../testing-validation" }

[[bin]]
name = "agent-orchestration-server"
path = "src/main.rs"
