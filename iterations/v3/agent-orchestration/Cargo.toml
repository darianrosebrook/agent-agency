[package]
name = "agent-orchestration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tokio.workspace = true
async-trait.workspace = true

# Agent crates
agent-workers = { path = "../agent-workers" }
# Logging and observability
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror.workspace = true
uuid.workspace = true
chrono = { workspace = true, features = ["serde"] }
anyhow.workspace = true
schemars.workspace = true
futures = "0.3"
futures-util = "0.3"

# Database and persistence
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
tokio-postgres = "0.7"
parking_lot = "0.12"

# HTTP and web framework
reqwest = { workspace = true, features = ["json"] }
axum = { version = "0.7", optional = true }
axum-extra = { version = "0.9", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }
utoipa = { version = "4.0", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "6.0", features = ["axum"], optional = true }

# Compression and utilities
flate2 = "1.0"
sha2 = "0.10"
regex = "1.10"
once_cell = "1.19"
tokio-util = "0.7"
rand = "0.8"
fastrand = "2.0"
md5 = "0.7"
crossbeam = "0.8"
clap = { version = "4.0", features = ["derive"] }
tempfile = "3.0"

# Machine learning and AI
linfa = "0.7"
linfa-linear = "0.7"
statrs = "0.16"
lru = "0.12"
strsim = "0.11"
rust-bert = { version = "0.21", optional = true }
tokenizers = "0.19"
lingua = "1.6"
whatlang = "0.18"
comrak = "0.18"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
pest = "2.7"
pest_derive = "2.7"
json5 = "0.4"
nom = "7.1"
indicatif = "0.16"
console = "0.16"

# Graph algorithms and utilities
petgraph = "0.6"
seahash = "4.1"

# Local workspace crates
agent-agency-contracts = { path = "../agent-agency-contracts" }
agent-evaluation = { path = "../agent-evaluation" }
system-common-interfaces = { path = "../system-common-interfaces" }
# data-infrastructure = { path = "../data-infrastructure", optional = true, default-features = false }  # Circular dependency - using local type definitions instead
data-infrastructure = { path = "../data-infrastructure", default-features = false }  # Required for main.rs database initialization
# data-interfaces-adapters removed to break circular dependency - factory moved to agent-orchestration
system-acceleration = { path = "../system-acceleration" }
agent-memory = { path = "../agent-memory", optional = true, features = ["database", "embeddings", "contracts"] }
system-resilience = { path = "../system-resilience" }
agent-research = { path = "../agent-research", optional = true }
agent-model-management = { path = "../agent-model-management", optional = true }
# agent-constitutional-council = { path = "../agent-constitutional-council", optional = true }  # Circular dependency - using local type definitions instead
# system-federated-ml = { path = "../system-federated-ml", optional = true }  # Circular dependency - using local type definitions instead
# agent-workers = { path = "../agent-workers", optional = true }  # Circular dependency - using local type definitions instead
agent-data-processing = { path = "../agent-data-processing", optional = true }  
development-tools = { path = "../development-tools", optional = true }

# Observability dependency
system-observability = { path = "../system-observability" }

[features]
default = ["research"]  # Research (claim extraction) is always-on per arbiter stack requirements
api-server = ["axum", "axum-extra", "tower-http", "utoipa", "utoipa-swagger-ui"]
full = ["dep:rust-bert", "development-tools"]
with_bert = ["dep:rust-bert"]
development = ["development-tools"]
memory = ["agent-memory"]  # Gate memory functionality behind feature flag
research = ["agent-research"]  # Research functionality (claim extraction) - now in default features
data-processing = ["dep:agent-data-processing"]  # Gate data processing integration behind feature flag
evaluation = []  # Gate evaluation framework behind feature flag
council = []  # Feature flag for council functionality
tool-chain = []  # Feature flag for tool-chain functionality

[dev-dependencies]
insta = { version = "1.38", features = ["yaml"] }
proptest = "1.5"

[[bin]]
name = "agent-orchestration-server"
path = "src/main.rs"
