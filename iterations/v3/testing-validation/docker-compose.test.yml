version: "3.8"

services:
  # PostgreSQL database for persistence testing
  postgres:
    image: pgvector/pgvector:pg15
    container_name: agent_agency_test_postgres
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432" # Use different port to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./test-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test_network

  # Redis for caching (if needed)
  redis:
    image: redis:7-alpine
    container_name: agent_agency_test_redis
    ports:
      - "6380:6379" # Use different port to avoid conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test_network

volumes:
  postgres_data:

networks:
  test_network:
    driver: bridge
