[package]
name = "testing-validation"
version = "0.1.0"
edition = "2021"

[dependencies]
# Dependencies for testing validation
agent-orchestration = { path = "../agent-orchestration", optional = true }
agent-constitutional-council = { path = "../agent-constitutional-council", optional = true }
agent-agency-contracts = { path = "../agent-agency-contracts" }
data-infrastructure = { path = "../data-infrastructure" }
data-interfaces-adapters = { path = "../data-interfaces-adapters", optional = true }
system-common-interfaces = { path = "../system-common-interfaces" }
system-quality-security = { path = "../system-quality-security" }
system-observability = { path = "../system-observability" }
tokio = { version = "1", features = ["full", "process"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
regex = "1"
reqwest = { version = "0.11", features = ["json"] }
tokio-postgres = "0.7"
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
bb8 = "0.8"
bb8-postgres = "0.8"
refinery = { version = "0.8", features = ["tokio-postgres"] }
url = "2.5"
git2 = "0.19"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.31"
ring = "0.17"
base64 = "0.22"
hex = "0.4"

# ML/NLP dependencies for assertion generation
system-federated-ml = { path = "../system-federated-ml", optional = true }
agent-research = { path = "../agent-research", optional = true }
anyhow = "1.0"
futures = "0.3"
clap = { version = "4", features = ["derive"] }

# Schema generation for JSON schemas
schemars = { version = "0.8", features = ["derive"] }

[features]
default = []
full = ["agent-research", "system-federated-ml", "agent-orchestration/evaluation", "agent-constitutional-council", "data-interfaces-adapters"]
e2e = []

[[bin]]
name = "ensure_services"
path = "src/bin/ensure_services.rs"

[[bin]]
name = "integrated_test"
path = "src/bin/integrated_test.rs"
