[package]
name = "agent-model-management"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Core async runtime
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Date/time handling
chrono.workspace = true

# Logging
tracing.workspace = true

# HTTP client for external model APIs
reqwest.workspace = true

# Database access
sqlx.workspace = true

# Vector operations and math
ndarray = { workspace = true }
rand = { workspace = true }

# Model loading and inference
# NOTE: torch/tch dependencies removed - not currently used
# tch.workspace = true

# Semver for version management
semver = "1.0"

# Common types
system-configuration = { path = "../system-configuration" }

[features]
default = ["inference", "hotswap"]
inference = []
hotswap = []
models = []
