[workspace]
resolver = "2"
members = [
    "agent-data-processing",  # NEW: Unified data processing pipeline consolidating ingestors/enrichers/indexers/knowledge/file-ops
    # "agent-workers",  # NEW: Consolidated MCP-based worker system - temporarily disabled
    # "agent-mcp",  # Consolidated MCP implementation - temporarily disabled
    "agent-model-management",  # NEW: Unified model lifecycle, inference, and deployment management
    "agent-research",  # NEW: Unified advanced AI research platform (research + reflexive-learning + model-benchmarking + claim-extraction + planning-agent + self-prompting-agent)
    "agent-orchestration",  # NEW: Unified orchestration and council decision-making system
    "agent-memory",  # NEW: Agent memory system with knowledge graphs and embeddings
    "system-acceleration",  # NEW: Unified hardware acceleration framework (apple-silicon + ane-tests)
    "system-resources",  # NEW: Unified resource management & production services (resource-manager + production)
    "system-resilience",  # NEW: Unified fault tolerance & recovery framework (resilience + recovery + workspace-state-manager + memory)
    "system-observability",  # NEW: Unified monitoring & telemetry services (system-health-monitor + observability + telemetry)
    "system-quality-security",  # NEW: Unified security & quality framework (security + security-policy-enforcer + quality-gates + source-integrity + provenance)
    "system-federated-ml",  # NEW: Unified distributed ML & optimization framework (federated-learning + runtime-optimization + tool-ecosystem)
    "system-configuration",  # NEW: Unified configuration & common utilities (config + common-types + common-patterns + common-pipeline)
    "data-infrastructure",  # NEW: Unified data layer & API services (database + interfaces + api-server + caching + embedding-service + file_ops)
    "data-interfaces",  # NEW: Unified interface layer & user experience (cli + web-app interfaces)
    "development-tools",  # NEW: Unified development workflow & quality assurance (caws/runtime-validator + apps/tools/caws + codemod + templates)
    "testing-validation",  # NEW: Unified testing platform & quality assurance (e2e-tests + integration-tests + brittleness-test + load-testing)
    "minimal-diff-evaluator",  # Differential evaluation and analysis
    ]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Darian Rosebrook <darian@example.com>"]
license = "MIT"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.74"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP and web
reqwest = { version = "0.11", features = ["json", "stream"] }
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
utoipa = { version = "4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.10"


# Configuration
config = "0.14"
clap = { version = "4.0", features = ["derive"] }

# Apple Silicon specific
core-foundation = "0.9"
objc = "0.2"

# Concurrent data structures
parking_lot = "0.12"
dashmap = "5.5"

# Half-precision floating point
half = "2.4"

# Additional dependencies for parallel-workers
tokio-util = { version = "0.7", features = ["time"] }
path-absolutize = "3.1"

# Vector operations for embeddings
ndarray = "0.15"

# Random number generation
rand = { version = "0.8", features = ["std"] }

# Force compatible versions to resolve indicatif/console conflicts
indicatif = "0.17"
console = { version = "0.15", features = ["std"] }

# PyTorch/ML integration (unified workspace version)
tch = { version = "0.13", default-features = false }
torch-sys = { version = "0.13", default-features = false }

# CAWS integration (using Node.js tools, not Rust crate)
# caws-core = { path = "../../apps/tools/caws" }

pkcs8 = "0.10"

# Consolidated crate dependencies
agent-orchestration = { path = "agent-orchestration" }
agent-workers = { path = "agent-workers" }
system-resources = { path = "system-resources" }
data-infrastructure = { path = "data-infrastructure" }
testing-validation = { path = "testing-validation" }
system-observability = { path = "system-observability" }
data-interfaces = { path = "data-interfaces" }
system-quality-security = { path = "system-quality-security" }
agent-research = { path = "agent-research" }
system-resilience = { path = "system-resilience" }
system-configuration = { path = "system-configuration" }
system-federated-ml = { path = "system-federated-ml" }
development-tools = { path = "development-tools" }

# Core agent components
agent-mcp = { path = "agent-mcp" }
agent-memory = { path = "agent-memory" }
agent-model-management = { path = "agent-model-management" }
agent-data-processing = { path = "agent-data-processing" }
agent-agency-contracts = { path = "agent-agency-contracts" }

# Common utilities now consolidated in system-configuration

# Infrastructure and services
embedding-service = { path = "embedding-service" }
minimal-diff-evaluator = { path = "minimal-diff-evaluator" }
caching = { path = "caching" }
file_ops = { path = "file_ops" }

# Observability backends are now handled by system-observability crate

[profile.release]
opt-level = 3
debug = 1                  # keep some symbols for backtraces
incremental = false        # avoid pathological LTO+incremental combos
codegen-units = 1          # best runtime perf/size
lto = "thin"               # great perf/size without full-fat link times
panic = "abort"            # if acceptable for binaries
strip = "symbols"          # if smaller artifacts help link time/size

[profile.dev]
opt-level = 0
debug = 2
incremental = true
codegen-units = 256        # maximize parallel codegen for quick rebuilds
lto = "off"
debug-assertions = true
overflow-checks = true

[profile.test]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256
lto = "off"
debug-assertions = true
