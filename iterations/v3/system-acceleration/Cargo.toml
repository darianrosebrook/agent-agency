[package]
name = "system-acceleration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "src/ane/README.md"

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { version = "0.8", features = ["derive"] }
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# CRITICAL: DO NOT CHANGE THESE DEPENDENCIES - CoreML functionality depends on workspace-aligned versions
# These dependencies use workspace versions to ensure compatibility across the codebase.
# DO NOT override these with specific versions - they must match workspace versions.
# DO NOT change tokenizers version - it must be 0.19 for CoreML compatibility.
# Last fixed: P0 priority - candle-core dependency alignment (2025-01-XX)
# Acceleration-specific dependencies
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
half.workspace = true
memmap2 = { workspace = true }
safetensors = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }

# Apple Silicon specific (conditional compilation)
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.27"
objc = "0.2"
cocoa-foundation = "0.1"
core-foundation = "0.9"
core-graphics = "0.22"

# ANE/Core ML support (macOS only)
coreml-rs = "0.1"

# Concurrent data structures
parking_lot = "0.12"

# Vector operations
ndarray = { workspace = true }

# Image processing
image = { workspace = true }

# Random number generation
rand = { workspace = true }

# Date/time handling
chrono = { workspace = true }

# Local crates
agent-agency-contracts = { path = "../agent-agency-contracts" }
system-configuration = { path = "../system-configuration" }

[features]
default = []
metal = []
coreml = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
