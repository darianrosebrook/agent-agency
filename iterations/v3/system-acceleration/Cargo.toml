[package]
name = "system-acceleration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "src/ane/README.md"

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true

# Acceleration-specific dependencies
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
half.workspace = true
memmap2 = "0.9"
safetensors = "0.4"
tokenizers = "0.19"
hf-hub = "0.3"

# Apple Silicon specific (conditional compilation)
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.27"
objc = "0.2"
cocoa-foundation = "0.1"
core-foundation = "0.9"
core-graphics = "0.22"

# ANE/Core ML support (macOS only)
coreml-rs = "0.1"

# Concurrent data structures
parking_lot = "0.12"

# Vector operations
ndarray = { workspace = true }

# Image processing
image = { workspace = true }

# Random number generation
rand = { workspace = true }

# Date/time handling
chrono = { workspace = true }

# Local crates
agent-agency-contracts = { path = "../agent-agency-contracts" }
system-configuration = { path = "../system-configuration" }

[features]
default = []
metal = []
coreml = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
