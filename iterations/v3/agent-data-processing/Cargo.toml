[package]
name = "agent-data-processing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "src/README.md"

[dependencies]
# Core async runtime
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Database
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# HTTP client for external sources
reqwest.workspace = true
mime = "0.3"

# File system operations
walkdir = "2.4"
ignore = "0.4"
sha2 = "0.10"
md5 = "0.7"
flate2 = "1.0"
notify = "6.0"  # File system watching

# Image and video processing
image = { workspace = true, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
av-data = "0.4"

# PDF processing
lopdf = "0.32"
pdf = "0.8"

# Subtitle parsing
# subtitle-parser = "0.1" # TODO: Add when crate becomes available
regex = "1.10"
schemars = { version = "0.8", features = ["derive"] }

# Compression and archiving
tar = "0.4"

# Git operations
git2 = "0.19"

# Path handling
pathdiff = "0.2"

# Pattern matching
glob = "0.3"
globset = "0.4"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Production cache with TTL
moka = { version = "0.12", features = ["future"] }

# MIME type inference from file content
infer = "0.15"

# Retry logic with exponential backoff
backoff = { version = "0.4", features = ["tokio"] }

# WordNet SQLite database (using workspace sqlx)
# rusqlite = { version = "0.31.0", features = ["bundled"] }
# deadpool-sqlite = "0.9"

# Integration with agent-memory (disabled due to circular dependency)
# agent-memory = { path = "../agent-memory", optional = true, default-features = false, features = ["database", "embeddings", "contracts"] }

# Integration with system-resilience
system-resilience = { path = "../system-resilience", optional = true }

# Data infrastructure (includes embedding functionality)
data-infrastructure = { path = "../data-infrastructure", optional = true }

# CoreML acceleration for audio transcription and object detection
system-acceleration = { path = "../system-acceleration", optional = true }

# Database client (avoid circular dependency - database functionality stays in database crate)

# Common types
system-configuration = { path = "../system-configuration" }

# Context preservation specific
dashmap.workspace = true
crossbeam = "0.8"
parking_lot = "0.12"
futures = "0.3"

[features]
default = ["workspace-integration"]  # memory-integration disabled by default
# memory-integration = ["agent-memory"]  # Feature flag for memory integration (disabled)
workspace-integration = ["system-resilience"]
embeddings = ["data-infrastructure"] # Re-enabled for conditional compilation
coreml = ["system-acceleration"] # CoreML model integration for audio transcription and object detection

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = "0.5"
