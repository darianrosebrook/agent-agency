[package]
name = "agent-data-processing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Core async runtime
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Database
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# HTTP client for external sources
reqwest.workspace = true

# File system operations
walkdir = "2.4"
ignore = "0.4"
sha2 = "0.10"
flate2 = "1.0"

# Image and video processing
image = "0.24"
av-data = "0.2"

# PDF processing
lopdf = "0.32"
pdf = "0.8"

# Vector operations and HNSW
ndarray = "0.15"
rand.workspace = true
priority-queue = "2.0"
dashmap.workspace = true

# Compression and archiving
tar = "0.4"

# Git operations
git2 = "0.19"

# Path handling
pathdiff = "0.2"

# Pattern matching
glob = "0.3"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Integration with agent-memory (optional to avoid circular dependencies)
agent-memory = { path = "../agent-memory", optional = true }

# Integration with workspace-state-manager
workspace-state-manager = { path = "../workspace-state-manager", optional = true }

# Embedding service
embedding-service = { path = "../embedding-service", optional = true }

# Database client (avoid circular dependency - database functionality stays in database crate)

[features]
default = ["workspace-integration", "embeddings"]
memory-integration = ["agent-memory"]
workspace-integration = ["workspace-state-manager"]
embeddings = ["embedding-service"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = "0.5"
