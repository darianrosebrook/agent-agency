[package]
name = "agent-memory"
version = "0.1.0"
edition = "2021"
authors = ["Darian Rosebrook <hello@darianrosebrook.com>"]
description = "Enterprise-grade agent memory system with knowledge graphs, vector embeddings, and temporal reasoning"
license = "MIT"
readme = "README.md"

[dependencies]
# Core async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
schemars = { version = "0.8", features = ["derive"] }

# Database
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
chrono = { workspace = true, features = ["serde"] }

# HTTP and web
reqwest = { workspace = true, features = ["json", "stream"] }

# Logging and observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
regex = "1.10"

# Concurrent data structures
dashmap = { workspace = true }

# Half-precision floating point for embeddings
half = { workspace = true }

# Vector operations for embeddings
ndarray = { workspace = true }

# Random number generation
rand = { workspace = true, features = ["std"] }

# Compression for context offloading
flate2 = "1.0"

# Hashing for content integrity
sha2 = "0.10"

# Configuration
config = { workspace = true }

# Interfaces
system-common-interfaces = { path = "../system-common-interfaces" }

# Contracts for unified types
agent-agency-contracts = { path = "../agent-agency-contracts", default-features = false, features = ["serde"] }

# Integration with existing services
# data-infrastructure = { path = "../data-infrastructure", optional = true }  # Removed to break circular dependency - now using direct sqlx
# agent-data-processing = { path = "../agent-data-processing", optional = true, features = ["embeddings"] }  # Removed to break circular dependency - not actually used

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = ["graph-reasoning", "database"]
embeddings = []  # Now uses direct sqlx, no external dependencies
graph-reasoning = []
temporal-analysis = []
context-offloading = []
provenance-tracking = []
database = []  # Now uses direct sqlx, always available
contracts = []  # Enable memory system adapter for contracts integration
