[package]
name = "agent-agency-contracts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "src/README.md"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:schemars"]
std = []

[dependencies]
# Core deps (always required)
once_cell = "1.19"
jsonschema = { version = "0.17", default-features = false, features = ["draft202012"] }
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow = "1.0"

# Optional serialization
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1" }  # Always available - used in Evidence metadata
schemars = { version = "0.8", optional = true, default-features = false, features = ["derive"] }

# Legacy dependencies - still used in some files, but deprecated for new code
# New code should use BoxFuture instead of async-trait, error codes instead of thiserror
async-trait = "0.1"
thiserror = "1.0"

[dev-dependencies]
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }