version: "3.8"

services:
  # Core Agent Agency API Server
  api-server:
    image: agent-agency/api-server:${TAG:-latest}
    container_name: agent-agency-api
    restart: unless-stopped
    environment:
      - RUST_LOG=info,agent_agency=debug
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CAWS_CONSTITUTION_PATH=/app/caws-constitution.yaml
      - PROMETHEUS_METRICS_ENABLED=true
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_API_KEY}
    ports:
      - "8889:8889"
    volumes:
      - ./caws-constitution.yaml:/app/caws-constitution.yaml:ro
      - ./ssl:/app/ssl:ro
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8889/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G

  # Streaming Pipeline Service
  streaming-pipeline:
    image: agent-agency/streaming-pipeline:${TAG:-latest}
    container_name: agent-agency-streaming
    restart: unless-stopped
    environment:
      - RUST_LOG=info,system_federated_ml=debug
      - DATABASE_URL=${DATABASE_URL}
      - PROMETHEUS_METRICS_ENABLED=true
      - STREAMING_MAX_CONCURRENT=20
      - ADAPTIVE_BATCHING_ENABLED=true
      - CPU_AFFINITY_ENABLED=false # Platform dependent
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 4G

  # Curriculum Learning Service
  curriculum-service:
    image: agent-agency/curriculum-service:${TAG:-latest}
    container_name: agent-agency-curriculum
    restart: unless-stopped
    environment:
      - RUST_LOG=info,agent_orchestration=debug
      - DATABASE_URL=${DATABASE_URL}
      - PROMETHEUS_METRICS_ENABLED=true
      - LEARNING_RATE=0.1
      - MAX_HISTORY_SIZE=10000
    depends_on:
      - postgres
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: agent-agency-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=agent_agency
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MAX_CONNECTIONS=100
      - POSTGRES_SHARED_BUFFERS=512MB
      - POSTGRES_WORK_MEM=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d agent_agency"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agent-agency-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-agency-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    networks:
      - agent-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: agent-agency-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - agent-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: agent-agency-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-server
      - grafana
    networks:
      - agent-network

  # Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: agent-agency-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - agent-network

  # Log Shipping
  promtail:
    image: grafana/promtail:latest
    container_name: agent-agency-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - agent-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  agent-network:
    driver: bridge






