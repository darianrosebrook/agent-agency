[package]
name = "data-interfaces"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
clap = { version = "4.0", features = ["derive"] }

# Web framework (from cli)
axum = { version = "0.7", features = ["json", "ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# HTTP client (from cli)
reqwest = { version = "0.11", features = ["json"] }

# File watching (from cli)
notify = "6.0"

# Lazy static initialization (from cli)
lazy_static = "1.4"

# Local crates
agent-workers = { path = "../agent-workers" }
agent-orchestration = { path = "../agent-orchestration" }
# agent-data-processing = { path = "../agent-data-processing" } # TEMPORARILY DISABLED
agent-agency-contracts = { path = "../agent-agency-contracts" }
system-configuration = { path = "../system-configuration" }

[[bin]]
name = "agent-agency-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "agent-agency-advanced-cli"
path = "src/bin/advanced-cli.rs"

[[bin]]
name = "agent-agency-api-server"
path = "src/bin/api-server.rs"

[dev-dependencies]
tokio-test = "0.4"
