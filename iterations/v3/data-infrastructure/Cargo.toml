[package]
name = "data-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
clap = { version = "4.0", features = ["derive"] }

# Web framework (from interfaces and api-server)
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
axum-extra = { version = "0.9", features = ["typed-header"] }

# Schema generation for API docs
schemars = { version = "0.8", features = ["uuid1", "chrono", "derive"] }

# OpenAPI documentation generation
utoipa = { version = "4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# HTTP client (from api-server)
reqwest = { version = "0.11", features = ["json"] }

# Async streams (from api-server)
tokio-stream = "0.1"

# Database-specific dependencies (from database)
deadpool = "0.10"
deadpool-postgres = "0.11"
tokio-postgres = "0.7"
sha2 = "0.10"
argon2 = "0.5"
password-hash = "0.5"
regex = "1.10"
once_cell = "1.19"

# Additional dependencies (from api-server)
base64 = "0.21"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Compression and archive support (from backup-validator)
flate2 = "1.0"
tar = "0.4"
tempfile = "3.8"

# Futures utilities (from data-consistency)
futures-util = "0.3"
futures = "0.3"

# Redis for WebSocket session management
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

# CRITICAL: DO NOT CHANGE THESE DEPENDENCIES - CoreML compatibility requires workspace-aligned versions
# These dependencies were updated from specific versions to workspace versions to fix candle-core conflicts.
# DO NOT revert to specific versions (e.g., tokenizers = "0.15") - must use workspace version (0.19).
# DO NOT override workspace versions - they ensure CoreML functionality works across crates.
# Last fixed: P0 priority - candle-core dependency alignment (2025-01-XX)
# Embedding-specific dependencies
dashmap = "5.5"
lru = "0.12"
# futures is already declared above
candle-core = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }

# SafeTensors and HuggingFace dependencies for model loading
safetensors = { workspace = true }
hf-hub = { workspace = true }
half = { workspace = true }

# ONNX Runtime for embedding inference with ANE acceleration
# CoreML feature is optional - can be disabled for tests
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
ndarray = "0.16"

# Local crates
agent-agency-contracts = { path = "../agent-agency-contracts" }
# agent-orchestration = { path = "../agent-orchestration", optional = true }  # Removed to break circular dependency
system-configuration = { path = "../system-configuration" }
system-quality-security = { path = "../system-quality-security" }
agent-mcp = { path = "../agent-mcp", optional = true }
system-common-interfaces = { path = "../system-common-interfaces" }

[features]
default = ["orchestration", "coreml"]  # Enable orchestration and CoreML by default for production
mcp = ["agent-mcp"]
orchestration = []  # Feature flag for conditional compilation
schema-validation = []  # Enable comprehensive schema validation
coreml = ["ort/coreml"]  # CoreML/ANE acceleration for production (optional for tests)

[[bin]]
name = "run_migrations"
path = "src/bin/run_migrations.rs"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
