[package]
name = "data-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
clap = { version = "4.0", features = ["derive"] }

# Web framework (from interfaces and api-server)
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
axum-extra = { version = "0.9", features = ["typed-header"] }

# HTTP client (from api-server)
reqwest = { version = "0.11", features = ["json"] }

# Async streams (from api-server)
tokio-stream = "0.1"

# Database-specific dependencies (from database)
deadpool = "0.10"
deadpool-postgres = "0.11"
tokio-postgres = "0.7"
sha2 = "0.10"
regex = "1.10"
once_cell = "1.19"

# Additional dependencies (from api-server)
base64 = "0.21"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Compression and archive support (from backup-validator)
flate2 = "1.0"
tar = "0.4"
tempfile = "3.8"

# Futures utilities (from data-consistency)
futures-util = "0.3"

# Embedding-specific dependencies
dashmap = "5.5"
lru = "0.12"
futures = "0.3"
candle-core = "0.9"
candle-transformers = "0.9"
tokenizers = "0.15"

# SafeTensors and HuggingFace dependencies for model loading
safetensors = "0.4"
hf-hub = "0.3"
half = "2.4"

# Local crates
agent-agency-contracts = { path = "../agent-agency-contracts" }
system-configuration = { path = "../system-configuration" }
system-quality-security = { path = "../system-quality-security" }
agent-mcp = { path = "../agent-mcp" }

[features]
default = []
mcp = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
