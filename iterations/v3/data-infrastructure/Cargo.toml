[package]
name = "data-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
clap = { version = "4.0", features = ["derive"] }

# Web framework (from interfaces and api-server)
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
axum-extra = { version = "0.9", features = ["typed-header"] }

# HTTP client (from api-server)
reqwest = { version = "0.11", features = ["json"] }

# Async streams (from api-server)
tokio-stream = "0.1"

# Database-specific dependencies (from database)
deadpool = "0.10"
deadpool-postgres = "0.11"
tokio-postgres = "0.7"
sha2 = "0.10"
regex = "1.10"
once_cell = "1.19"

# Additional dependencies (from api-server)
base64 = "0.21"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local crates
agent-agency-contracts = { path = "../agent-agency-contracts" }
agent-agency-common-types = { path = "../common-types" }
agent-agency-security = { path = "../security" }
system-observability = { path = "../system-observability" }
agent-orchestration = { path = "../agent-orchestration" }

# Keep database functionality separate to avoid circular dependencies
embedding-service = { path = "../embedding-service", optional = true }

[features]
default = []
embeddings = ["embedding-service"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
tower = { version = "0.4", features = ["util"] }
hyper = { version = "0.14", features = ["full"] }
