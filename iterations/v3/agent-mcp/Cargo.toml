[package]
name = "agent-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "src/README.md"

[dependencies]
development-tools = { path = "../development-tools" }
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Schema generation for API docs
schemars = { version = "0.8", features = ["derive"] }

# Resilience and observability dependencies
system-resilience = { path = "../system-resilience" }
system-observability = { path = "../system-observability" }
system-quality-security = { path = "../system-quality-security" }

# File operations service - runtime injection pattern to avoid circular dependency
# Note: Cannot directly depend on data-infrastructure due to circular dependency
# (data-infrastructure optionally depends on agent-mcp). Users should inject the
# real FileOperationsService via ToolRegistry::with_file_ops().
# However, when both crates are available, use the 'file-ops' feature to enable
# the helper function that creates real implementations.
system-common-interfaces = { path = "../system-common-interfaces" }

# Memory system for memory MCP tools - removed to avoid cyclic dependency
# agent-memory = { path = "../agent-memory", optional = true }

# Common types and abstractions
system-configuration = { path = "../system-configuration" }

# Database dependencies for rate limiting persistence
sqlx = { workspace = true, features = ["postgres", "chrono", "uuid"] }
chrono.workspace = true
uuid.workspace = true

# MCP-specific dependencies
jsonrpc-core = "18.0"
jsonrpc-derive = "18.0"
jsonrpc-ws-server = "18.0"
jsonrpc-http-server = "18.0"
tokio-tungstenite = "0.21"
futures-util = "0.3"
url = "2.4"

# Tool discovery and management
dashmap = "5.5"
parking_lot = "0.12"
tokio-util = "0.7"

# CAWS integration
walkdir = "2.4"
glob = "0.3"
toml = "0.8"
serde_yaml = "0.9"
tempfile = "3.10"

# CAWS runtime validator (placeholder dependency)
# caws_runtime_validator = { path = "../caws_runtime_validator" }

# Documentation quality validator

# HTTP client for health checks
reqwest = { version = "0.12", features = ["json"] }

# Metrics collection
prometheus = "0.14"
lazy_static = "1.4"

[features]
default = []
test-utils = []
# memory = ["agent-memory/database"]  # Removed to avoid cyclic dependency

[dev-dependencies]
tokio-test = "0.4"
