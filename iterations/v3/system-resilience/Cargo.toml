[package]
name = "system-resilience"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { version = "0.8", features = ["derive"] }
serde_yaml = "0.9"
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
clap = { version = "4.0", features = ["derive"] }
num_cpus = "1.0"
regex = "1.10"
walkdir = "2.4"
sqlx.workspace = true

# Resilience-specific dependencies (from resilience)
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }

# Recovery-specific dependencies (from recovery)
blake3 = "1.5"
zstd = "0.13"
flate2 = "1.0"
similar = "2.0"
fastcdc = "3.0"
glob = "0.3"
hex = "0.4"
bincode = "1.3"
tracing-subscriber = "0.3"

# Git integration for provenance
git2 = "0.19"

# Cryptographic hashing
sha2 = "0.10"

# Memory management utilities
lazy_static = "1.4"
once_cell = "1.19"

# Platform-specific dependencies for handle cleanup and metrics
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["handleapi", "minwinbase", "processthreadsapi", "psapi", "sysinfoapi"] }

# System metrics collection - temporarily disabled
# sysinfo = "0.30"
procfs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = { path = "../system-configuration" }

# Local crates
agent-agency-contracts = { path = "../agent-agency-contracts" }

[features]
default = []

[dev-dependencies]
tokio-test = "0.4"
proptest = "1.0"
tempfile = "3.0"

[[bin]]
name = "system-resilience-cli"
path = "src/bin/recov.rs"
