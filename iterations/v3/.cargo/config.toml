[build]
# Default to aarch64-apple-darwin for Apple Silicon
# Comment out if you need to build for x86_64 or universal binary
target = "aarch64-apple-darwin"
# Note: jobs is set via CARGO_BUILD_JOBS environment variable
# Defaults to number of CPUs if not set

# Network configuration for dependency downloads
# Prevent timeout issues during crate downloads
[net]
retry = 3
git-fetch-with-cli = true

[target.aarch64-apple-darwin]
rustflags = [
  # Dev iteration speed:
  "-C", "codegen-units=16",
  "-C", "incremental=true",
  # macOS 13.0 minimum for Swift Concurrency compatibility
  # Required by WhisperKit and other Swift packages using async/await
  "-C", "link-arg=-mmacosx-version-min=13.0",
]

# C++17 support for torch-sys and CoreML compilation
# These environment variables are passed to build scripts
# Note: torch-sys build script reads CXXFLAGS directly from environment
[env]
CXXFLAGS = "-std=c++17 -stdlib=libc++"
CXX = "clang++"
CC = "clang"
# Note: CARGO_NET_TIMEOUT should be set as environment variable, not in config.toml

# Swift runtime library path for CoreML/Swift bridge integration
# This ensures libswift_Concurrency.dylib and other Swift runtime libraries are found
# IMPORTANT: /usr/lib/swift must come FIRST - it contains Swift 6 concurrency symbols
# with the 'isolation' parameter (withTaskGroup, withCheckedContinuation, etc.)
# The swift-5.5 backport library does NOT have these Swift 6 symbols
DYLD_LIBRARY_PATH = "/usr/lib/swift:/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx:/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.5/macosx"

# Optional: speed up linker on dev (keeps symbol info)
[profile.dev]
opt-level = 1
debug = true
split-debuginfo = "packed"
