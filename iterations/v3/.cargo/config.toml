[build]
# Default to aarch64-apple-darwin for Apple Silicon
# Comment out if you need to build for x86_64 or universal binary
target = "aarch64-apple-darwin"

[target.aarch64-apple-darwin]
rustflags = [
  # Dev iteration speed:
  "-C", "codegen-units=16",
  "-C", "incremental=true",
]

# C++17 support for torch-sys and CoreML compilation
# These environment variables are passed to build scripts
# Note: torch-sys build script reads CXXFLAGS directly from environment
[env]
CXXFLAGS = "-std=c++17 -stdlib=libc++"
CXX = "clang++"
CC = "clang"

# Optional: speed up linker on dev (keeps symbol info)
[profile.dev]
opt-level = 1
debug = true
split-debuginfo = "packed"
