[package]
name = "agent-research"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
sqlx.workspace = true
ndarray = { workspace = true }

# Research-specific dependencies (from research)
reqwest = { version = "0.11", features = ["json", "stream"] }
scraper = "0.18"
url = "2.4"
dashmap = "5.5"
parking_lot = "0.12"
qdrant-client = "1.10"
fxhash = "0.2"
lru = "0.12"
deadpool-postgres = "0.11"
select = "0.6"
html5ever = "0.26"
tendril = "0.4"
encoding_rs = "0.8"
pulldown-cmark = "0.10"
ammonia = "3.3"
regex = "1.10"
strsim = "0.10"
image.workspace = true

# Learning and optimization (from reflexive-learning)
petgraph = "0.6"
rayon = "1.8"
rand.workspace = true
indicatif = "0.17"
console = { version = "0.16", features = ["std"] }

# Benchmarking and metrics (from model-benchmarking)
criterion = "0.5"
prometheus = "0.13"
statistical = "0.1"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tracing-subscriber = "0.3"

# Claim extraction specific (from claim-extraction)
nom = "7.1"
fastrand = "2.0"
once_cell = "1.5"
md5 = "0.7"
futures = "0.3"
walkdir = "2.4"
priority-queue = "1.3"

# Local crates
agent-orchestration = { path = "../agent-orchestration" }
agent-workers = { path = "../agent-workers" }
agent-memory = { path = "../agent-memory" }
system-acceleration = { path = "../system-acceleration", optional = true }
# embedding-service now consolidated into data-infrastructure
data-infrastructure = { path = "../data-infrastructure" }
agent-data-processing = { path = "../agent-data-processing" } 
agent-agency-contracts = { path = "../agent-agency-contracts" }
system-configuration = { path = "../system-configuration" }
system-observability = { path = "../system-observability" }

[features]
default = []
coreml = ["system-acceleration"]

[dev-dependencies]
tokio-test = "0.4"
