[package]
name = "agent-workers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
schemars = { version = "0.8", features = ["derive"] }

# MCP integration - our newly consolidated system
agent-mcp = { path = "../agent-mcp" }

# Contracts for task definitions
agent-agency-contracts = { path = "../agent-agency-contracts" }

# Resilience patterns
system-resilience = { path = "../system-resilience" }

# System observability for metrics collection
system-observability = { path = "../system-observability" }

# Database client
data-infrastructure = { path = "../data-infrastructure" }

# Database dependencies (used by learning persistence)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Core memory system - every agent has memory
agent-memory = { path = "../agent-memory" }

# Additional utilities
dashmap = "5.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"

# Code analysis and complexity metrics (from workers crate)
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

# Concurrent data structures (from parallel-workers)
crossbeam = "0.8"
futures = "0.3"
tokio-stream = "0.1"
bytes = "1.5"
rand = "0.8"

# Path handling and utilities (from parallel-workers)
path-absolutize = "3.1"
tokio-util = "0.7"
regex = "1.10"

# Metrics and quantiles (from parallel-workers)
tdigest = "0.1"
hyperloglogplus = "0.1"
ahash = "0.8"

# CLI framework (from worker crate)
clap = { version = "4.0", features = ["derive"] }

# Web framework (from worker crate)
axum.workspace = true
tower-http.workspace = true

[features]
default = []
test-utils = []

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "agent-workers"
path = "src/main.rs"
