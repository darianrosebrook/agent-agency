[package]
name = "development-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Core async runtime
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true

# Time handling
chrono.workspace = true

# Utilities
uuid.workspace = true

# File system operations
walkdir = "2.4"

# Regular expressions
regex.workspace = true

# JSON schema validation
jsonschema = "0.17"

# HTTP client for external tool communication
reqwest = { workspace = true, features = ["json"] }

# Command execution
tokio-util = "0.7"

# Diff evaluation specific
diff = "0.1"
similar = "2.4"

# AST parsing for language-specific analysis
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

# Graph algorithms for change impact analysis
petgraph = "0.6"

# Integration with existing V3 components
system-quality-security = { path = "../system-quality-security" }
# agent-mcp = { path = "../agent-mcp" }  # Removed to avoid cyclic dependency
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
full = []
validation = []
codemod = []

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
agent-mcp = { path = "../agent-mcp" }
chrono = { workspace = true }
