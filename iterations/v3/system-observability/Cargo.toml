[package]
name = "system-observability"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow = "1.0"
futures = "0.3"
rand = "0.8"

# Database integration
data-infrastructure = { path = "../data-infrastructure" }

# Local crates
agent-agency-common-types = { path = "../common-types" }

# System monitoring (from system-health-monitor)
sysinfo = "0.30"
prometheus = "0.13"
dashmap = "5.5"
crossbeam = "0.8"
parking_lot = "0.12"
reqwest = { version = "0.11", features = ["json"] }
regex = "1.10"

# Statistical analysis (from system-health-monitor)
tdigest = "0.2"
hdrhistogram = "7.5"

# Redis integration (from system-health-monitor and observability)
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Tracing and logging (from observability)
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
cadence = "1.4"   # StatsD client

# ONNX protobuf parsing (from observability)
protobuf = "3.4"
lru = "0.12"  # LRU cache for metadata

# macOS system calls (from system-health-monitor)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"
core-foundation = "0.9"

# Windows system monitoring (from system-health-monitor)
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["pdh", "winbase", "handleapi", "processthreadsapi"] }
windows = { version = "0.52", features = ["Win32_System_Performance", "Win32_System_Wmi", "Win32_Storage_FileSystem"] }

# Database integration (from system-health-monitor)
sqlx = { workspace = true, features = ["postgres", "chrono", "uuid"] }

# Optional integrations (from system-health-monitor)
agent-orchestration = { path = "../agent-orchestration", optional = true }
agent-agency-research = { path = "../research", optional = true }
agent-workers = { path = "../agent-workers", optional = true }
agent-data-processing = { path = "../agent-data-processing", optional = true }

[features]
default = []
full = [
    "agent-orchestration",
    "agent-agency-research",
    "agent-workers",
    "agent-data-processing"
]

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.0"
tempfile = "3.0"
