[package]
name = "system-quality-security"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
regex = "1.10"
clap = { version = "4.0", features = ["derive"] }

# Schema generation for API docs
schemars = { version = "0.8", features = ["uuid1", "chrono"] }

# Security-specific dependencies (from security)
ring = { version = "0.17.12", features = ["std"] }
rustls = "0.23"
jsonwebtoken = "9.0"
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"
bcrypt = "0.15"
zxcvbn = "2.2"
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }

# Secret management dependencies (from security)
aws-config = "1.0"
aws-sdk-secretsmanager = "1.3"
azure_identity = "0.18"
azure_security_keyvault = "0.18"
gcp_auth = "0.8"
hashicorp_vault = "2.1"
rand = "0.8"
rand_distr = "0.5"

# Additional dependencies (from security)
lazy_static = "1.4"
axum = "0.7"

# Policy enforcement dependencies (from security-policy-enforcer)
glob = "0.3"
pathdiff = "0.2"
walkdir = "2.4"
ignore = "0.4"
git2 = "0.19"

# Cryptographic signing
pkcs8 = "0.10"

# File system and process security (from security-policy-enforcer)
libc = "0.2"
nix = "0.28"

# Compression for log archiving (from security-policy-enforcer)
flate2 = "1.0"

# Cryptographic dependencies (from security-policy-enforcer)
base64 = "0.22"
hex = "0.4"

# Quality gates dependencies (from quality-gates)
# File system operations already included above

# Source integrity dependencies (from source-integrity)
blake3 = "1.5"
sha2 = "0.10"
sqlx = { workspace = true, features = ["postgres", "chrono", "uuid"] }

# Local crates
agent-agency-contracts = { path = "../agent-agency-contracts" }
system-configuration = { path = "../system-configuration" }

# Singleton patterns for global instances
once_cell = "1.0"

# Temporary files for tests
tempfile = "3.8"

[features]
default = []
cli = []

[dev-dependencies]
tokio-test = "0.4"
insta = "1.39"
