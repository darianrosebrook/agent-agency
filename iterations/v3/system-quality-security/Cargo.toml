[package]
name = "system-quality-security"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
regex = "1.10"
clap = { version = "4.0", features = ["derive"] }

# Security-specific dependencies (from security)
ring = { version = "0.17", features = ["std"] }
rustls = "0.23"
jsonwebtoken = "9.0"
argon2 = { version = "0.5", features = ["std"] }
password-hash = "0.5"
bcrypt = "0.15"
zxcvbn = "2.2"

# Secret management dependencies (from security)
aws-config = "1.0"
aws-sdk-secretsmanager = "1.3"
rand = "0.8"

# Additional dependencies (from security)
lazy_static = "1.4"
axum = "0.7"

# Policy enforcement dependencies (from security-policy-enforcer)
glob = "0.3"
pathdiff = "0.2"
walkdir = "2.4"
ignore = "0.4"
git2 = "0.19"

# File system and process security (from security-policy-enforcer)
libc = "0.2"
nix = "0.28"

# Compression for log archiving (from security-policy-enforcer)
flate2 = "1.0"

# Cryptographic dependencies (from security-policy-enforcer)
base64 = "0.22"
hex = "0.4"

# Quality gates dependencies (from quality-gates)
# File system operations already included above

# Source integrity dependencies (from source-integrity)
blake3 = "1.5"
sha2 = "0.10"
sqlx = { workspace = true, features = ["postgres", "chrono", "uuid"] }

# Local crates
agent-orchestration = { path = "../agent-orchestration" }
agent-agency-provenance = { path = "../provenance" }
data-infrastructure = { path = "../data-infrastructure" }
agent-agency-config = { path = "../config" }
agent-agency-contracts = { path = "../agent-agency-contracts" }
agent-agency-common-types = { path = "../common-types" }

[features]
default = []
cli = []

[dev-dependencies]
tokio-test = "0.4"
