[package]
name = "agent-constitutional-council"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
futures = "0.3"
regex = "1.10"
once_cell = "1.19"

# Schema generation for API docs
schemars = { version = "0.8", features = ["uuid1", "chrono"] }

# Contracts (stable interface) - NO dependency on system-acceleration or engine-coreml
agent-agency-contracts = { path = "../agent-agency-contracts" }

# Orchestration for CAWS validation
agent-orchestration = { path = "../agent-orchestration" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
