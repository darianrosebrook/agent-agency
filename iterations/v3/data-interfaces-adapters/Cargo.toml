[package]
name = "data-interfaces-adapters"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true

# Database (for memory adapter)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Web framework (for API server binary)
axum = { version = "0.7", features = ["json", "ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# CLI framework (for API server binary)
clap = { version = "4.0", features = ["derive"] }

# Schema generation (for JsonSchema derives)
schemars = { version = "0.8", features = ["chrono"] }

# TOML parsing (for config files)
toml = "0.8"

# Interface contracts
data-interfaces = { path = "../data-interfaces" }
agent-agency-contracts = { path = "../agent-agency-contracts" }

# Implementation crates (these dependencies are OK in adapters)
agent-workers = { path = "../agent-workers" }
agent-orchestration = { path = "../agent-orchestration" }
agent-research = { path = "../agent-research" }
agent-memory = { path = "../agent-memory" }
data-infrastructure = { path = "../data-infrastructure", features = ["orchestration"] }
agent-mcp = { path = "../agent-mcp" }
agent-data-processing = { path = "../agent-data-processing", features = ["coreml"] }

[features]
default = ["orchestration"]
orchestration = []
memory = ["agent-orchestration/memory"]  # Enable memory feature for UnifiedOrchestrator

[[bin]]
name = "agent-agency-api-server"
path = "src/bin/api-server.rs"

[dev-dependencies]
tokio-test = "0.4"

