[package]
name = "data-interfaces-adapters"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true

# Database (for memory adapter)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Web framework (for API server binary)
axum = { version = "0.7", features = ["json", "ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"

# HTTP client (for CLI binaries)
reqwest = { version = "0.11", features = ["json"] }

# File watching (for CLI binaries)
notify = "6.0"

# CLI framework
clap = { version = "4.0", features = ["derive"] }

# Lazy static initialization (for CLI binaries)
lazy_static = "1.4"

# Interface contracts
data-interfaces = { path = "../data-interfaces" }
agent-agency-contracts = { path = "../agent-agency-contracts" }

# Implementation crates (these dependencies are OK in adapters)
agent-workers = { path = "../agent-workers" }
agent-orchestration = { path = "../agent-orchestration" }
agent-research = { path = "../agent-research" }
agent-memory = { path = "../agent-memory" }
data-infrastructure = { path = "../data-infrastructure" }

[[bin]]
name = "agent-agency-cli"
path = "src/bin/cli-main.rs"

[[bin]]
name = "agent-agency-advanced-cli"
path = "src/bin/advanced-cli.rs"

[[bin]]
name = "agent-agency-api-server"
path = "src/bin/api-server.rs"

[dev-dependencies]
tokio-test = "0.4"

