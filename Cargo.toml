# This file serves as a workspace root for rust-analyzer
# The actual Rust workspace is in iterations/v3/

[workspace]
resolver = "2"
members = [
    "iterations/v3/agent-data-processing",
    "iterations/v3/agent-workers",
    "iterations/v3/agent-mcp",
    "iterations/v3/agent-model-management",
    "iterations/v3/agent-research",
    "iterations/v3/agent-orchestration",
    "iterations/v3/agent-memory",
    "iterations/v3/system-acceleration",
    "iterations/v3/system-resources",
    "iterations/v3/system-resilience",
    "iterations/v3/system-observability",
    "iterations/v3/system-quality-security",
    "iterations/v3/system-federated-ml",
    "iterations/v3/system-configuration",
    "iterations/v3/data-infrastructure",
    "iterations/v3/data-interfaces",
    "iterations/v3/development-tools",
    "iterations/v3/testing-validation",
    "iterations/v3/agent-agency-contracts"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Darian Rosebrook <darian@example.com>"]
license = "MIT"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
pkcs8 = { version = "0.10", features = ["std"] }

# HTTP and web
reqwest = { version = "0.11", features = ["json", "stream"] }

# Caching
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
axum = { version = "0.7", features = ["json", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }

# Async utilities
futures = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.14"
clap = { version = "4.0", features = ["derive"] }

# Apple Silicon specific
core-foundation = "0.9"
objc = "0.2"

# Vector operations for embeddings
dashmap = "5.5"
parking_lot = "0.12"
# Safe PyTorch wrapper (optional PyTorch linking)
ndarray = "0.15"

# Half-precision floating point for embeddings
half = "2.3"

# Random number generation
rand = { version = "0.8", features = ["std"] }

# Compression
flate2 = "1.0"

# Hashing
sha2 = "0.10"

# Regular expressions
regex = "1.10"

# Git operations
git2 = "0.19"

# File system operations
walkdir = "2.4"
ignore = "0.4"

# Hashing and checksums
blake3 = "1.5"

# Compression
tar = "0.4"

# Path handling
pathdiff = "0.2"

# Pattern matching
glob = "0.3"

# Testing
tempfile = "3.8"

# Utilities
paste = "1.0"

