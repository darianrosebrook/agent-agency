# This file serves as a workspace root for rust-analyzer
# The actual Rust workspace is in iterations/v3/

[workspace]
resolver = "2"
members = [
    "xtask",
    "iterations/v3/agent-data-processing",
    "iterations/v3/agent-workers",
    "iterations/v3/agent-mcp",
    "iterations/v3/agent-model-management",
    "iterations/v3/agent-research",
    "iterations/v3/agent-orchestration",
    "iterations/v3/agent-memory",
    "iterations/v3/system-acceleration",
    "iterations/v3/system-resources",
    "iterations/v3/system-resilience",
    "iterations/v3/system-observability",
    "iterations/v3/system-quality-security",
    "iterations/v3/system-federated-ml",
    "iterations/v3/system-configuration",
    "iterations/v3/data-infrastructure",
    "iterations/v3/data-interfaces",
    "iterations/v3/development-tools",
    "iterations/v3/agent-agency-contracts"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Darian Rosebrook <hello@darianrosebrook.com>"]
license = "MIT"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1.74"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["derive"] }
toml = "0.8"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP and web
reqwest = { version = "0.11", features = ["json", "stream"] }
axum = { version = "0.7", features = ["json", "ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
utoipa = { version = "4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace", "metrics"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.10"


# Configuration
config = "0.14"
clap = { version = "4.0", features = ["derive"] }

# Apple Silicon specific
core-foundation = "0.9"
objc = "0.2"

# Concurrent data structures
parking_lot = "0.12"
dashmap = "5.5"

# Half-precision floating point
half = "2.4"

# Additional dependencies for parallel-workers
tokio-util = { version = "0.7", features = ["time"] }
path-absolutize = "3.1"

# Vector operations for embeddings
ndarray = "0.15"

# Image processing
image = { version = "0.24", features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }

# Random number generation - aligned with candle-core requirements
rand = "0.8.5"

# Testing and verification infrastructure
insta = "1.39"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

# Force compatible versions to resolve indicatif/console conflicts
indicatif = "0.17"
console = { version = "0.15", features = ["std"] }

# CRITICAL: DO NOT CHANGE THESE VERSIONS - CoreML functionality depends on aligned versions
# These versions were carefully aligned to resolve candle-core conflicts that blocked CoreML.
# Changing these versions may break CoreML inference, YOLO, and fp16 precision conversion.
# DO NOT update these without thorough testing of CoreML functionality.
# DO NOT downgrade or change tokenizers version (0.19 is required for CoreML).
# Last fixed: P0 priority - candle-core dependency alignment (2025-01-XX)
# ML/AI dependencies - aligned versions to prevent conflicts
tokenizers = "0.19"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
safetensors = "0.4"
hf-hub = "0.3"
memmap2 = "0.9"

pkcs8 = "0.10"

